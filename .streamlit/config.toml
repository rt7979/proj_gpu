# ========================================================
# Streamlit 專案全域設定檔
# ========================================================

[server]
# 💡 啟用靜態檔案伺服功能（允許網頁讀取 static/ 資料夾下的圖片、CSS 與 JS）
enableStaticServing = true

# 💡 設定網頁執行的 Port 號（預設是 8501，有需要可以自己改）
# port = 8501

[theme]
# 🎨 你也可以在這裡設定網站的預設主題顏色
primaryColor = "#FF4B4B"      # 企業主色調（按鈕、選單高亮）
backgroundColor = "#FFFFFF"  # 網頁背景色